name: tests

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.3', '8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: '.node-version'
          cache: true

      - name: Install Node Dependencies
        run: vp install

      - name: Install Playwright Dependencies
        run: vp exec playwright install

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Build Assets
        run: vp run build:ssr

      - name: Tests
        run: ./vendor/bin/pest

      - name: Upload browser failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts-php-${{ matrix.php-version }}
          path: |
            tests/Browser/Screenshots
            tests/Browser/Console
            tests/Browser/Logs
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: '.node-version'
          cache: true
      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          vp install
      - run: php artisan wayfinder:generate --with-form
      - run: composer lint
      - run: vp check
      - run: vp run types:check

  deploy-production:
    runs-on: ubuntu-latest
    needs: [tests, lint]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Laravel Cloud Deploy Webhook
        run: curl -X POST "$LARAVEL_CLOUD_DEPLOY_WEBHOOK"
        env:
          LARAVEL_CLOUD_DEPLOY_WEBHOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_WEBHOOK }}

  deploy-storybook:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [tests, lint]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: '.node-version'
          cache: true
      - run: vp install
      - run: vp run build-storybook
      - name: Publish Storybook
        working-directory: storybook-static
        run: |
          touch .nojekyll
          git init
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b gh-pages
          git add -A
          git commit -m 'deploy'
          git push -f https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git gh-pages
